name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        # next build sets NODE_ENV=production, which triggers serverEnv guards.
        # Provide non-secret placeholders so page-data collection can import env.
        env:
          FAMILY_DDB_TABLE: mcpeak
          FAMILY_USE_IN_MEMORY_DB: "false"
          FAMILY_SESSION_SECRET: ci-build-session-secret-at-least-32-chars
          FAMILY_LOGIN_ANSWER: ci-build-answer
          FAMILY_MESSAGING_DRY_RUN: "true"
          FAMILY_SMS_ENABLED: "false"
          NEXT_PUBLIC_SITE_URL: https://mcpeakfamily.org
        run: npm run build

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (non-destructive)
        # Drop the production .next from the Build step so `next dev` starts clean.
        run: rm -rf .next && npm run test:smoke
